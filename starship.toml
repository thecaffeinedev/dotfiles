"$schema" = 'https://starship.rs/config-schema.json'

scan_timeout = 60
add_newline = false
command_timeout = 600

[line_break]
disabled = true

[username]
style_user = "bold #F8FAFC"
style_root = "bold #FF4D6D"
format = "󰀵 [$user]($style) [on](dimmed #7C8599)"
show_always = true

[directory]
format = " 󰉋 [$path]($style) "
style = "bold #FFB000"
truncation_symbol = "…/"
home_symbol = "~"
read_only = " "
read_only_style = "bold #FF4D6D"

[cmd_duration]
format = "[󰔛 $duration]($style) "
style = "dimmed #94A3B8"

[status]
disabled = false
format = "[$symbol $status]($style) "
style = "bold #FF4D6D"
not_found_symbol = ""
not_executable_symbol = ""
sigint_symbol = "ﭦ"
map_symbol = true

[package]
format = "[$symbol$version]($style) "
symbol = "󰏓 "
disabled = true

[git_branch]
format = "[$symbol$branch]($style) "
symbol = " "
style = "bold #58A6FF"

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold #2DD4BF"

# Working tree
modified = " 󰏫${count}"
untracked = " ?${count}"
deleted = " ${count}"
renamed = " ${count}"
typechanged = " 󰉺${count}"

# Staged changes
staged = " 󰐕${count}"

# Special states
conflicted = " 󰀨${count}"
stashed = " 󰆓${count}"

# Remote sync
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕${ahead_count}/${behind_count}"
up_to_date = ""

[python]
format = '[${symbol}(\($virtualenv\) )]($style)'
symbol = " "
style = "bold #FFD166"

[nodejs]
format = "[$symbol($version )]($style)"
style = "bold #A3E635"

[php]
format = "[$symbol($version )]($style)"
symbol = " "
style = "bold #C4B5FD"

[java]
format = "[${symbol}(${version} )]($style)"
symbol = " "
style = "bold #FB7185"

[rust]
format = "[$symbol($version )]($style)"
style = "bold #FB923C"

[golang]
format = "[$symbol($version )]($style)"
symbol = " "
style = "bold #38BDF8"

[dart]
format = "[$symbol($version )]($style)"
style = "bold #22D3EE"
symbol = " "

[shell]
disabled = true
