"$schema" = 'https://starship.rs/config-schema.json'

scan_timeout = 60
add_newline = false
command_timeout = 600

[line_break]
disabled = true

[username]
style_user = "bold #f2f8ff"
style_root = "bold #BF616A"
format = "󰀵 [$user]($style) [on](dimmed white)"
show_always = true

[directory]
format = " 󰉋 [$path]($style) "
style = "bold #18c063"
truncation_symbol = "…/"
home_symbol = "~"
read_only = " "
read_only_style = "bold #BF616A"

[cmd_duration]
format = "[$duration]($style) "

[status]
disabled = false
format = "[$symbol $status]($style) "
not_found_symbol = ""
not_executable_symbol = ""
sigint_symbol = "ﭦ"
map_symbol = true

[package]
format = "[$symbol$version]($style) "
symbol = "󰏓 "
disabled = true

[git_branch]
format = "[$symbol$branch]($style) "
symbol = " "
style = "bold #f0c91c"

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold cyan"

# Working tree
modified = " 󰏫${count}"
untracked = " ?${count}"
deleted = " ${count}"
renamed = " ${count}"
typechanged = " 󰉺${count}"

# Staged changes
staged = " 󰐕${count}"

# Special states
conflicted = " 󰀨${count}"
stashed = " 󰆓${count}"

# Remote sync
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕${ahead_count}/${behind_count}"
up_to_date = ""

[python]
format = '[${symbol}(\($virtualenv\) )]($style)'
symbol = " "

[nodejs]
format = "[$symbol($version )]($style)"

[php]
format = "[$symbol($version )]($style)"
symbol = " "

[java]
format = "[${symbol}(${version} )]($style)"
symbol = " "

[rust]
format = "[$symbol($version )]($style)"

[golang]
format = "[$symbol($version )]($style)"
symbol = " "

[dart]
format = "[$symbol($version )]($style)"
style = "bold cyan"
symbol = " "

[shell]
disabled = true
